[package]
name = "qlexpress-derive"
description = "Procedural macros for qlexpress native type registration"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
documentation = "https://docs.rs/qlexpress-derive"
readme = "README.md"
keywords = ["qlexpress", "proc-macro", "derive", "scripting"]
categories = ["development-tools::procedural-macro-helpers"]
publish = ["crates-io"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }

[dev-dependencies]
# 让 derive crate 的单测能直接调用 qlexpress（避免循环依赖的话，
# 单测可放在 qlexpress crate 里,这里只放 proc-macro 自身的解析单测)。
