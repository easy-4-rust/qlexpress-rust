name: Production Readiness

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  JAVA_BASELINE_SHA: 9065b9ac5d985dcd02e627239aa9cdb78fb2f7f3

jobs:
  # ── Rust native steps: cross-platform matrix ──────────────────────────
  format:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  rust-platform:
    name: Rust (${{ matrix.os }})
    needs: format
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-features

      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps

  # ── Java baseline integration: Ubuntu only (Maven + Java 21) ─────────
  java-integration:
    name: Java Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout qlexpress-rust
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout pinned Java baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: alibaba/QLExpress
          ref: ${{ env.JAVA_BASELINE_SHA }}
          path: java-baseline

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt

      - name: Rust documentation quality
        run: python3 scripts/check_rust_doc_quality.py

      - name: Java official script suite
        run: mvn -q -f java-baseline/pom.xml -Djacoco.skip=true -Dtest=TestSuiteRunner#suiteTest test

      - name: Java and Rust differential
        run: python3 verification/run_differential.py --java-repo java-baseline

      - name: Replay official Java scripts in Rust
        run: cargo run -q -p qlexpress-verification -- replay java-baseline

  # ── Verification suite: Ubuntu only (cargo run -p qlexpress-verification) ─
  verification:
    name: Verification Suite
    needs: [rust-platform, java-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Concurrency acceptance
        run: cargo run -q -p qlexpress-verification -- concurrency 8 1000

      - name: Deterministic security fuzz
        run: cargo run -q -p qlexpress-verification -- security-fuzz 10000

      - name: Business host integration
        run: cargo run -q -p qlexpress-verification -- business-host

      - name: Canary and rollback drill
        run: cargo run -q -p qlexpress-verification -- canary

      - name: Load acceptance
        run: cargo run -q -p qlexpress-verification -- load 10 4

  # ── Supply chain audit ────────────────────────────────────────────────
  audit:
    name: Supply Chain Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit

  # ── libFuzzer: nightly, Ubuntu only ───────────────────────────────────
  libfuzzer:
    name: libFuzzer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up nightly Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Prepare temporary corpus
        run: cp -R fuzz/corpus/parser_sandbox target-fuzz-corpus

      - name: Run libFuzzer
        # -detect_leaks=0：LSan 对退出时仍被静态结构持有的 ~2KB 分配误报
        # （数千次迭代总量恒定，非每轮泄漏）；本目标验收的是隔离策略下的
        # crash/hang/OOM，泄漏检测交给 clippy/测试与专用审计。
        run: cargo fuzz run parser_sandbox target-fuzz-corpus -- -max_total_time=30 -rss_limit_mb=2048 -detect_leaks=0
