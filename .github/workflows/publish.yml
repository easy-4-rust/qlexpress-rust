name: Publish crates

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (e.g. v0.1.0-beta.0)
        required: true
        type: string

# 全局串行化：避免两个 tag 并发发布竞态写 crates.io 索引。
concurrency:
  group: crates-io-publish
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # 与本地验证环境一致：固定 1.97.1，避免 stable 漂移导致发布构建不可复现
  # （MSRV 1.85；Production Readiness 仍跑 rolling stable，覆盖更宽矩阵）。
  RUST_TOOLCHAIN: "1.97.1"

jobs:
  production-readiness:
    name: Production readiness
    uses: ./.github/workflows/production-readiness.yml
    permissions:
      contents: read

  publish:
    name: Publish to crates.io
    needs: production-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release

    permissions:
      contents: read
      id-token: write

    outputs:
      version: ${{ steps.version.outputs.value }}

    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Validate release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" = "workflow_dispatch" ]]; then
            tag="${{ inputs.version }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          # 预发布版本合法（如 v0.1.0-beta.0）
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid tag format: $tag (expected vX.Y.Z[-suffix])"
            exit 1
          fi

          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Release tag must point to a commit contained in main"
            exit 1
          fi

          tag_version="${tag#v}"
          package_version="$(
            cargo metadata --no-deps --format-version 1 |
              jq -r '.packages[]
                | select(.name == "qlexpress")
                | .version'
          )"

          if [[ "${tag_version}" != "${package_version}" ]]; then
            echo "Tag ${tag_version} does not match package ${package_version}"
            exit 1
          fi

          echo "value=${tag_version}" >> "${GITHUB_OUTPUT}"

      - name: Check published versions
        id: published
        env:
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail

          derive_published=false
          core_published=false

          # Force a registry lookup. Without --registry, cargo info resolves the
          # local workspace package first and incorrectly reports it as published.
          if cargo info --registry crates-io "qlexpress-derive@${VERSION}" >/dev/null 2>&1; then
            derive_published=true
          fi
          if cargo info --registry crates-io "qlexpress@${VERSION}" >/dev/null 2>&1; then
            core_published=true
          fi

          echo "qlexpress-derive ${VERSION} published: ${derive_published}"
          echo "qlexpress ${VERSION} published: ${core_published}"
          echo "derive=${derive_published}" >> "${GITHUB_OUTPUT}"
          echo "core=${core_published}" >> "${GITHUB_OUTPUT}"

      - name: Authenticate with crates.io
        if: steps.published.outputs.derive != 'true' || steps.published.outputs.core != 'true'
        id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Guard registry token
        if: steps.published.outputs.derive != 'true' || steps.published.outputs.core != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # 前置：OIDC 换取失败立即报错（避免空 token 进入重试循环假绿）
          if [[ -z "${{ steps.crates_io_auth.outputs.token }}" ]]; then
            echo "::error::crates.io token exchange returned an empty token (check Trusted Publishing configuration)"
            exit 1
          fi

      - name: Dry-run derive package
        if: steps.published.outputs.derive != 'true'
        run: cargo publish --package qlexpress-derive --dry-run --locked

      - name: Publish derive crate
        if: steps.published.outputs.derive != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          # crates.io 索引传播 / 429 限流：3 次重试 + 退避
          for attempt in 1 2 3; do
            if out=$(cargo publish --package qlexpress-derive --locked 2>&1); then
              echo "Successfully published qlexpress-derive"
              ok=1
              break
            fi
            # 幂等重跑：版本已上传视为成功
            if echo "$out" | grep -qiE "already (uploaded|exists)"; then
              echo "qlexpress-derive already published (version exists), skipping"
              ok=1
              break
            fi
            echo "$out" | tail -5
            echo "Attempt $attempt failed for qlexpress-derive, waiting before retry..."
            sleep 15
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::qlexpress-derive 3 次重试后仍发布失败"
            exit 1
          fi

      - name: Wait for derive index
        if: steps.published.outputs.derive != 'true'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 30); do
            if cargo info --registry crates-io "qlexpress-derive@${VERSION}" >/dev/null 2>&1; then
              echo "qlexpress-derive ${VERSION} is available"
              exit 0
            fi

            echo "Waiting for crates.io index: ${attempt}/30"
            sleep 10
          done

          echo "Timed out waiting for qlexpress-derive ${VERSION}"
          exit 1

      - name: Verify core package
        if: steps.published.outputs.core != 'true'
        run: cargo publish --package qlexpress --dry-run --locked

      - name: Publish core crate
        if: steps.published.outputs.core != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for attempt in 1 2 3; do
            if out=$(cargo publish --package qlexpress --locked 2>&1); then
              echo "Successfully published qlexpress"
              ok=1
              break
            fi
            if echo "$out" | grep -qiE "already (uploaded|exists)"; then
              echo "qlexpress already published (version exists), skipping"
              ok=1
              break
            fi
            echo "$out" | tail -5
            echo "Attempt $attempt failed for qlexpress, waiting before retry..."
            sleep 15
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::qlexpress 3 次重试后仍发布失败"
            exit 1
          fi

  create-release:
    name: Create GitHub Release
    needs: [production-readiness, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          tag="v${VERSION}"

          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "GitHub release ${tag} already exists"
            exit 0
          fi

          release_args=(--verify-tag --generate-notes)
          if [[ "${tag}" == *-* ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "${tag}" \
            "${release_args[@]}" \
            --title "qlexpress ${VERSION}"
