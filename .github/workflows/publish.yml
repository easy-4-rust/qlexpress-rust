name: Publish crates

on:
  push:
    tags:
      - "v*"

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

jobs:
  production-readiness:
    name: Production readiness
    uses: ./.github/workflows/production-readiness.yml
    permissions:
      contents: read

  publish:
    name: Publish to crates.io
    needs: production-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master

      - name: Validate release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Release tag must point to a commit contained in main"
            exit 1
          fi

          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(
            cargo metadata --no-deps --format-version 1 |
              jq -r '.packages[]
                | select(.name == "qlexpress")
                | .version'
          )"

          if [[ "${tag_version}" != "${package_version}" ]]; then
            echo "Tag ${tag_version} does not match package ${package_version}"
            exit 1
          fi

          echo "value=${tag_version}" >> "${GITHUB_OUTPUT}"

      - name: Check published versions
        id: published
        env:
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail

          derive_published=false
          core_published=false

          # Force a registry lookup. Without --registry, cargo info resolves the
          # local workspace package first and incorrectly reports it as published.
          if cargo info --registry crates-io "qlexpress-derive@${VERSION}" >/dev/null 2>&1; then
            derive_published=true
          fi
          if cargo info --registry crates-io "qlexpress@${VERSION}" >/dev/null 2>&1; then
            core_published=true
          fi

          echo "qlexpress-derive ${VERSION} published: ${derive_published}"
          echo "qlexpress ${VERSION} published: ${core_published}"
          echo "derive=${derive_published}" >> "${GITHUB_OUTPUT}"
          echo "core=${core_published}" >> "${GITHUB_OUTPUT}"

      - name: Authenticate with crates.io
        if: steps.published.outputs.derive != 'true' || steps.published.outputs.core != 'true'
        id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish derive crate
        if: steps.published.outputs.derive != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
        run: cargo publish --package qlexpress-derive --locked

      - name: Wait for derive index
        if: steps.published.outputs.derive != 'true'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 30); do
            if cargo info --registry crates-io "qlexpress-derive@${VERSION}" >/dev/null 2>&1; then
              echo "qlexpress-derive ${VERSION} is available"
              exit 0
            fi

            echo "Waiting for crates.io index: ${attempt}/30"
            sleep 10
          done

          echo "Timed out waiting for qlexpress-derive ${VERSION}"
          exit 1

      - name: Verify core package
        if: steps.published.outputs.core != 'true'
        run: cargo publish --package qlexpress --dry-run --locked

      - name: Publish core crate
        if: steps.published.outputs.core != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
        run: cargo publish --package qlexpress --locked

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "GitHub release ${GITHUB_REF_NAME} already exists"
            exit 0
          fi

          release_args=(--verify-tag --generate-notes)
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "${GITHUB_REF_NAME}" \
            "${release_args[@]}" \
            --title "qlexpress ${GITHUB_REF_NAME#v}"
